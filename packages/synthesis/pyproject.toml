[project]
name = "woxpas-synthesis"
version = "0.1.0"
description = "Woxpas synthesis pipeline — citation-bound answer generation over retrieved memory"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "woxpas-storage",
  "woxpas-runtime",
  "woxpas-retrieval",
  "woxpas-pipeline",   # for CloudPolicyDenied + audit_cloud_egress
  "pydantic>=2.9",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core      = { workspace = true }
woxpas-storage   = { workspace = true }
woxpas-runtime   = { workspace = true }
woxpas-retrieval = { workspace = true }
woxpas-pipeline  = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_synthesis"]
