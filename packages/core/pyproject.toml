[project]
name = "woxpas-core"
version = "0.1.0"
description = "Woxpas core type contracts shared across all packages"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_core"]
