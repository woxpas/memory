[project]
name = "woxpas-retrieval"
version = "0.1.0"
description = "Woxpas retrieval pipeline — semantic, lexical, time-based, type-based, file, entity, graph queries"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "woxpas-storage",
  "woxpas-runtime",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core    = { workspace = true }
woxpas-storage = { workspace = true }
woxpas-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_retrieval"]
