[project]
name = "woxpas-storage"
version = "0.1.0"
description = "Woxpas storage clients: Postgres (with RLS), Qdrant, encrypted object store"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "asyncpg>=0.30",
  "qdrant-client>=1.13,<1.14",
  "aioboto3>=13.2",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_storage"]
