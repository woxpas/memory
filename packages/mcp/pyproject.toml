[project]
name = "woxpas-mcp"
version = "0.1.0"
description = "Woxpas MCP server — agent-facing tool surface (memory.* + resurface.*)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "woxpas-storage",
  "woxpas-pipeline",
  "woxpas-adapters",
  "woxpas-retrieval",
  "woxpas-synthesis",
  "woxpas-resurfacing",
  "woxpas-runtime",
  "woxpas-api",
  "mcp>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core        = { workspace = true }
woxpas-storage     = { workspace = true }
woxpas-pipeline    = { workspace = true }
woxpas-adapters    = { workspace = true }
woxpas-retrieval   = { workspace = true }
woxpas-synthesis   = { workspace = true }
woxpas-resurfacing = { workspace = true }
woxpas-runtime     = { workspace = true }
woxpas-api         = { workspace = true }

[project.scripts]
woxpas-mcp-server = "woxpas_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_mcp"]
