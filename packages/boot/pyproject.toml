[project]
name = "woxpas-boot"
version = "0.1.0"
description = "Woxpas boot daemon — passphrase → KEK → DEK, served over a local Unix socket"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-storage",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-storage = { workspace = true }

[project.scripts]
woxpas-unlock = "woxpas_boot.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_boot"]
