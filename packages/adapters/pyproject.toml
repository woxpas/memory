[project]
name = "woxpas-adapters"
version = "0.1.0"
description = "Woxpas capture-surface adapters (file, voice, MCP, browser, slack, agent, calendar)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "pydantic>=2.9",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_adapters"]
