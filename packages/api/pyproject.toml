[project]
name = "woxpas-api"
version = "0.1.0"
description = "Woxpas API gateway (localhost-only by default; cloud lift via reverse-proxy/mTLS)"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  "woxpas-core",
  "woxpas-storage",
  "woxpas-pipeline",
  "woxpas-adapters",
  "woxpas-retrieval",
  "woxpas-synthesis",
  "woxpas-resurfacing",
  "woxpas-runtime",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "pyjwt>=2.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
]

[tool.uv.sources]
woxpas-core      = { workspace = true }
woxpas-storage   = { workspace = true }
woxpas-pipeline  = { workspace = true }
woxpas-adapters  = { workspace = true }
woxpas-retrieval = { workspace = true }
woxpas-synthesis = { workspace = true }
woxpas-resurfacing = { workspace = true }
woxpas-runtime   = { workspace = true }

[project.scripts]
woxpas-api = "woxpas_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["woxpas_api"]
