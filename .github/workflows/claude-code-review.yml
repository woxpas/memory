name: Claude Code Review

# Automatically reviews pull requests on open/update using Anthropic's
# code-review plugin, posting inline comments.
#
# SECURITY (public repo): this uses `pull_request`, NOT `pull_request_target`.
# GitHub does not expose repo secrets to workflows triggered by fork PRs, so
# this job effectively runs only for PRs from branches inside this repo
# (i.e. maintainers). That's the safe default. To review an external/fork PR,
# a maintainer comments "@claude review this PR" — the claude.yml workflow
# handles that with secrets, because issue_comment runs in the base-repo
# context and is maintainer-gated.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip drafts; skip runs with no token available (e.g. fork PRs).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
