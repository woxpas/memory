name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # ruff is a self-contained binary and needs no project dependencies,
      # so we lint without a full workspace sync (fast, hermetic).
      - name: ruff check
        run: uvx ruff@0.15.12 check .

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: mypy
        run: uv run mypy packages

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: pytest (unit — no infrastructure)
        # Smoke batteries under tests/smoke/ need the full local stack and are
        # NOT run here; this runs the infra-free unit tests next to each package.
        run: uv run pytest packages -q
