name: woxpas

# Topology principles:
#   - All data services on internal-only network (no public ingress)
#   - API gateway is the only externally-bound service, and only on 127.0.0.1
#   - Workers have no inbound ports; pull-based via Postgres outbox
#   - Read-only filesystems where possible; capabilities dropped
#   - Cloud lift-and-shift: set woxpas-internal `internal: true` after model warmup,
#     put the gateway behind a private load balancer, no other changes

x-restart: &restart
  restart: unless-stopped

x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Shared env for the app services — host-specific values from .env are
# overridden here so they resolve to the compose service names, not 127.0.0.1.
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  CLAMAV_HOST: clamav
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PIPELINE_VERSION: ${PIPELINE_VERSION}

networks:
  woxpas-internal:
    driver: bridge
    # internal: true            # enable in production after first-run model fetch
  woxpas-public:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
  clamav-data:
  models:

services:
  postgres:
    image: pgvector/pgvector:pg17
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # No ports — internal only.

  qdrant:
    image: qdrant/qdrant:v1.13.5
    <<: *restart
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO
      # storage / hnsw / optimizer tunables live in infra/qdrant/config.yaml
    volumes:
      - qdrant-data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"            # disable web console in production
    volumes:
      - minio-data:/data
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  clamav:
    image: clamav/clamav:1.4
    <<: *restart
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ── Application services ───────────────────────────────────────────────
  #
  # All four app processes run from ONE image (../Dockerfile), differing only
  # by `command`. They are gated behind the `app` profile so a plain
  # `docker compose up` brings up only the datastores (what `woxpas-cli up` and
  # the bootstrap use). The supported happy path runs the app on the host via
  # `woxpas-cli up`; running it in containers (`docker compose --profile app up`)
  # is EXPERIMENTAL and still needs, for the API: API_HOST=0.0.0.0 to bind inside
  # the container AND API_AUTH_MODE=jwt (the dev-auth loopback guard refuses a
  # non-loopback bind). Tracked as a follow-up; see docs/GETTING_STARTED.md.

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-api"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      # Needed to bind inside the container; pair with API_AUTH_MODE=jwt (see note above).
      API_HOST: ${WOXPAS_API_CONTAINER_HOST:-0.0.0.0}
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
      - woxpas-public
    ports:
      - "127.0.0.1:${API_PORT:-7800}:7800"   # localhost ONLY
    read_only: true
    tmpfs:
      - /tmp:size=64M

  worker-pipeline:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-worker"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
      clamav: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      ACCEL_BACKEND: ${ACCEL_BACKEND:-auto}
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
    read_only: true
    tmpfs:
      - /tmp:size=512M
    # No ports — pull-based worker.

  dreaming-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-dreaming-worker"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # No ports — background insights loop.

  mcp:
    # Stdio MCP server, meant for `docker compose run --rm mcp`, not `up`.
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-mcp-server"]
    <<: *hardening
    stdin_open: true
    tty: false
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      WOXPAS_MCP_TENANT_ID: ${WOXPAS_DEV_TENANT_ID_DEFAULT:-}
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
