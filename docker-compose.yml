name: woxpas

# Topology principles:
#   - All data services on internal-only network (no public ingress)
#   - API gateway is the only externally-bound service, and only on 127.0.0.1
#   - Workers have no inbound ports; pull-based via Postgres outbox
#   - Read-only filesystems where possible; capabilities dropped
#   - Cloud lift-and-shift: set woxpas-internal `internal: true` after model warmup,
#     put the gateway behind a private load balancer, no other changes

x-restart: &restart
  restart: unless-stopped

x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Shared env for the app services — host-specific values from .env are
# overridden here so they resolve to the compose service names, not 127.0.0.1.
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  CLAMAV_HOST: clamav
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PIPELINE_VERSION: ${PIPELINE_VERSION}

networks:
  woxpas-internal:
    driver: bridge
    # internal: true            # enable in production after first-run model fetch
  woxpas-public:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
  clamav-data:
  models:

services:
  postgres:
    image: pgvector/pgvector:pg17
    <<: *restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # No ports — internal only.

  qdrant:
    image: qdrant/qdrant:v1.13.5
    <<: *restart
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO
      # storage / hnsw / optimizer tunables live in infra/qdrant/config.yaml
    volumes:
      - qdrant-data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"            # disable web console in production
    volumes:
      - minio-data:/data
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  clamav:
    image: clamav/clamav:1.4
    <<: *restart
    volumes:
      - clamav-data:/var/lib/clamav
    networks:
      - woxpas-internal
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ── Migrations (one-shot) ──────────────────────────────────────────────
  # Applies pending SQL migrations, then exits. App services wait for it to
  # finish. Uses the Postgres client image (psql) — no app build needed. Runs
  # on every `up` and is idempotent (each migration self-registers in
  # schema_migrations; already-applied versions are skipped).
  migrate:
    image: pgvector/pgvector:pg17
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - woxpas-internal
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -euo pipefail
        applied=$$(psql -Atqc "SELECT version FROM schema_migrations" 2>/dev/null || true)
        for f in /migrations/versions/*.sql; do
          base=$$(basename "$$f" .sql)
          if printf '%s\n' "$$applied" | grep -qx "$$base"; then continue; fi
          echo "[migrate] applying $$base"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "[migrate] up to date"

  # ── Application services ───────────────────────────────────────────────
  #
  # All app processes run from ONE image (./Dockerfile), differing only by
  # `command`. Profiles keep a plain `docker compose up` to datastores + the
  # worker:
  #   (default)        datastores + migrate
  #   --profile app    + worker-pipeline + dreaming-worker (portless; the memory
  #                      engine. This is all the Claude-Desktop/MCP path needs.)
  #   --profile api    + the HTTP gateway. OFF by default and, in a container,
  #                      pinned to API_AUTH_MODE=jwt with NO published port — the
  #                      header-trust dev mode is never exposed on a network
  #                      interface. (For local curl/testing, run the API on the
  #                      host via `woxpas-cli up`, where dev mode is loopback-safe.)
  #   --profile mcp    the stdio MCP server, for `docker compose run --rm mcp`.

  worker-pipeline:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-worker"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
      clamav: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      ACCEL_BACKEND: ${ACCEL_BACKEND:-auto}
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
    read_only: true
    tmpfs:
      - /tmp:size=512M
    # No ports — pull-based worker.

  dreaming-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-dreaming-worker"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # No ports — background insights loop.

  api:
    # OFF by default (opt-in `api` profile). In a container we pin jwt auth and
    # publish NO host port — the dev-auth loopback guard is never bypassed. If
    # you want the HTTP API on localhost, prefer the host path (`woxpas-cli up`).
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-api"]
    <<: [*restart, *hardening]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0           # bind inside the container (reachable only on the internal network)
      API_AUTH_MODE: jwt          # header-trust dev mode is never used in-container
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
    read_only: true
    tmpfs:
      - /tmp:size=64M
    # No ports — internal network only. Front it with a reverse proxy to expose.

  cli:
    # One-shot admin CLI in a container — lets a no-uv install generate secrets
    # and create the tenant without host Python:
    #   docker compose run --rm cli woxpas-cli init-env
    #   docker compose run --rm cli woxpas-cli init-tenant --display-name "You"
    # Mounts .env read-write so those write the infra secrets + the unwrapped DEK
    # back to the host file, which compose then injects into the app services.
    # (.env must exist first — `touch .env` — so Docker bind-mounts a file.)
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    <<: *hardening
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example:ro
    networks:
      - woxpas-internal
    # No depends_on: `init-env` must work before the datastores exist.
    # (`init-tenant` needs Postgres — bring the stack up first.)

  mcp:
    # Stdio MCP server, meant for `docker compose run --rm mcp`, not `up`.
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["woxpas-mcp-server"]
    <<: *hardening
    stdin_open: true
    tty: false
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      WOXPAS_MCP_TENANT_ID: ${WOXPAS_DEV_TENANT_ID_DEFAULT:-}
    volumes:
      - models:/var/woxpas/models
    networks:
      - woxpas-internal
